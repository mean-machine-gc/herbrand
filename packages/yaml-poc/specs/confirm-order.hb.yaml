type: outcome
agent:
  kind: machine
context: ordering
module: order_management
aggregate: order-processing
description: The system confirms a submitted order after verifying payment and stock
trigger: confirm_order
shouldFailWith:
  payment_failed:
    description: Payment could not be processed
    requiredInfo:
      - payment_status
    scenarios:
      - Credit card is declined
      - Payment gateway timeout
  stock_unavailable:
    description: One or more products are out of stock
    requiredInfo:
      - stock_levels
    scenarios:
      - Last unit was purchased by another customer moments before
shouldSucceedWith:
  order_confirmed:
    condition: always
    description: The order is confirmed and ready for fulfillment
    requiredInfo:
      - payment_status
      - stock_levels
shouldAssert:
  order_confirmed:
    - tag: order_status_confirmed
      description: The order status transitions to confirmed
      affectedInfo:
        - order_status
    - tag: payment_captured
      description: Payment has been charged to the customer
      affectedInfo:
        - payment_status
    - tag: stock_reserved
      description: Inventory is decremented for the ordered items
      affectedInfo:
        - stock_levels
