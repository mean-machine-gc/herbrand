type: outcome
agent:
  kind: machine
context: ordering
module: order_management
aggregate: order-processing
description: The system processes the submit order intent and transitions the order to submitted
trigger: submit_order
shouldFailWith:
  invalid_order_data:
    description: The order data is inconsistent at submission time
    requiredInfo:
      - order_status
      - order_line_items
    scenarios:
      - Order was modified concurrently and is now in an invalid state
shouldSucceedWith:
  order_submitted:
    condition: always
    description: The order transitions to submitted and is queued for confirmation
    requiredInfo:
      - order_status
      - order_line_items
    scenarios:
      - Customer submits a valid draft order with two items
shouldAssert:
  order_submitted:
    - tag: order_status_submitted
      description: The order status transitions to submitted
      affectedInfo:
        - order_status
    - tag: order_not_editable
      description: The order can no longer be modified by the customer
      affectedInfo:
        - order_editability
