type: intent
agent:
  kind: machine
context: ordering
module: order_management
aggregate: order-processing
businessGoal: deliver confirmed orders to customers
description: The system initiates fulfillment for a confirmed order
trigger:
  type: success
  outcome: order_confirmed
preconditions:
  order_ready_for_fulfillment:
    description: The order is in confirmed state and ready to be fulfilled
    requiredInfo:
      - order_status
    scenarios:
      - System tries to fulfill an order that was cancelled after confirmation
producesIntent:
  intent: fulfill_order
  description: The order is queued for picking, packing and shipping
  requiredInfo:
    - order_status
    - order_line_items
