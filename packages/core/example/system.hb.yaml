contexts:
  - type: institutional
    id: library-desk
    description: Front desk where librarians serve members
    kind: role-authority

  - type: software
    id: lms
    description: Library Management System — core lending platform
    boundary: internal

  - type: software
    id: billing-service
    description: External billing and payments service
    boundary: external

  - type: software
    id: notification-service
    description: External email and SMS notification service
    boundary: external

actors:
  - type: human
    id: librarian
    role: Librarian

  - type: llm
    id: catalog-bot
    description: AI assistant for catalog and member operations

  - type: machine
    id: lending-engine
    description: Deterministic lending transaction processor

  - type: machine
    id: fee-engine
    description: Deterministic fee calculation engine

  - type: machine
    id: registration-engine
    description: Deterministic member registration processor

  - type: machine
    id: notification-engine
    description: Notification dispatch engine

processes:
  - id: lending
    description: A member requests a book and it is lent to them
    startsWith: [book.requested]
    endsWith: [book.lent, member.loan.limit.reached]

  - id: book-return
    description: A member returns a book and the loan is closed
    startsWith: [book.returned]
    endsWith: [book.returned.processed, late.fee.applied]

  - id: member-registration
    description: A new person registers as a library member
    startsWith: [membership.requested]
    endsWith: [member.registered]

  - id: book-reservation
    description: A member reserves a book that is currently unavailable
    startsWith: [reservation.requested]
    endsWith: [reservation.placed, reservation.fulfilled]

  - id: overdue-notification
    description: The system detects overdue loans and notifies members
    startsWith: [daily.check.triggered]
    endsWith: [overdue.notification.sent]
